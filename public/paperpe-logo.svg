<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A84B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5E1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C1A0E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0A00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Emblem circle -->
  <circle cx="36" cy="36" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
  
  <!-- P letter body -->
  <rect x="24" y="20" width="5" height="32" fill="url(#darkGrad)" rx="2"/>
  
  <!-- P letter bowl -->
  <path d="M29 20 Q46 20 46 29 Q46 38 29 38" fill="none" stroke="url(#darkGrad)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Upward trending arrow/chart line through the P -->
  <polyline points="29,46 34,38 39,42 44,28 49,22" fill="none" stroke="#00C076" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="49,22 44,24 47,29" fill="#00C076"/>
  
  <!-- Gold sparkle dots -->
  <circle cx="18" cy="56" r="2" fill="#C8A84B" opacity="0.7"/>
  <circle cx="22" cy="62" r="1.5" fill="#C8A84B" opacity="0.5"/>
  <circle cx="14" cy="62" r="1" fill="#C8A84B" opacity="0.4"/>
  
  <!-- PaperPe text -->
  <text x="76" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#1A0A00" letter-spacing="-0.5">Paper</text>
  <text x="135" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#00C076" letter-spacing="-0.5">Pe</text>
  
  <!-- Tagline -->
  <text x="76" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#8B6914" letter-spacing="1.5">INDIA'S PAPER TRADING PLATFORM</text>
</svg>